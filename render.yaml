services:
  - type: web
    name: still-logbook
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.lock.txt && npm ci && npm run build
    # Migrates the schema and fills in any missing entry documents, then serves.
    startCommand: sh scripts/start.sh
    healthCheckPath: /api/health
    envVars:
      - key: STILL_DB_PATH
        value: /var/data/still.sqlite3
      - key: STILL_SEED_ON_FIRST_RUN
        value: "true"
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: NODE_VERSION
        value: 24.13.0
    disk:
      name: still-data
      mountPath: /var/data
      sizeGB: 1
