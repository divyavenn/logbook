name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.lock.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:editor-model
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test
